global:
  # Define collection interval.
  scrape_interval: 15s

scrape_configs:
  # Scrape Prometheus's own metrics from inside its container.
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
  # Scrape metrics exported by Node Exporter's text file collector.
  - job_name: 'static_metrics'
    static_configs:
      - targets: ['node-exporter:9100']
