# Compose Grafana with Prometheus as its metrics database.
services:
  nginx:
    # Define the image, container name, and restart policy.
    image: nginx:alpine
    container_name: nginx-static-metrics
    restart: unless-stopped
    # Mount the static metrics file as read-only Nginx web content.
    volumes:
      - ./metrics:/usr/share/nginx/html:ro
  prometheus:
    # Define the Prometheus image, container name, and restart policy.
    image: prom/prometheus
    container_name: prometheus
    restart: unless-stopped
    # Mount the scrape configuration and persistent metrics storage.
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    # Configure Prometheus storage, startup, and runtime options.
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"

  grafana:
    # Define the Grafana image, container name, and restart policy.
    image: grafana/grafana
    container_name: grafana
    restart: unless-stopped
    # Start Grafana after its Prometheus dependency.
    depends_on:
      - prometheus
    # Publish the Grafana web interface on the host.
    ports:
      - "3000:3000"
    # Configure the Grafana administrator credentials through a secret file.
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
    secrets:
      - grafana_admin_password
    # Mount the persistent database and provisioning configuration.
    volumes:
      - grafana_data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro

# Load the Grafana administrator password from an external secret file.
secrets:
  grafana_admin_password:
    file: ./admin_password.txt

# Persistent storage for Prometheus metrics and Grafana data.
volumes:
  prometheus_data:
  grafana_data:
