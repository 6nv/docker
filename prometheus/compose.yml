# Compose a Prometheus container.
services:
  prometheus-db:
    # Define the image, container name, and restart policy.
    image: prom/prometheus
    container_name: prometheus
    restart: unless-stopped
    # Publish container ports on the host.
    ports:
      - '9090:9090'
    # Mount the configuration and persistent metrics storage.
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_db_data:/prometheus
    # Prometheus startup options.
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'

  static-metrics:
    image: nginx:alpine
    container_name: static-metrics
    restart: unless-stopped
    volumes:
      - ./metrics:/usr/share/nginx/html/metrics.txt:ro

# Persistent storage for Prometheus time-series data managed by Docker Compose.
volumes:
  prometheus_db_data:
