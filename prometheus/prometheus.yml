global:
  # Define collection and alerting intervals.
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Serve metrics as a text file over HTTP so Prometheus can scrape it.
  - job_name: 'static_metrics'
    metrics_path: /metrics.txt
    static_configs:
      - targets: ['static-metrics:80']
